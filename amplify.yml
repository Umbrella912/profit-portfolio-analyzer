version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p site-output/sample-data
        - cp index.html style.css script.js site-output/
        # Optional: copy sample CSVs (used by "Load Superstore data") only if present
        - if ls sample-data/*.csv >/dev/null 2>&1; then cp sample-data/*.csv site-output/sample-data/; else echo "No sample-data/*.csv found - skipping"; fi
  artifacts:
    baseDirectory: site-output
    files:
      - '**/*'
  cache:
    paths: []
